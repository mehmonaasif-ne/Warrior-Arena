<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="purpleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0b0314" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="purpleWhiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <filter id="whiteGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#ffffff" flood-opacity="0.9"/>
    </filter>
    <filter id="purpleNeon" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#a855f7" flood-opacity="0.9"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="100" fill="#0b0314"/>
  <circle cx="256" cy="256" r="230" fill="url(#purpleGlow)"/>
  
  <!-- Outer Glowing Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#purpleWhiteGrad)" stroke-width="10" filter="url(#purpleNeon)"/>
  
  <!-- Crossed Celestial Blades -->
  <g transform="translate(256,256)">
    <!-- Blade 1 -->
    <path d="M-150,-150 L-130,-170 L150,110 L130,130 Z" fill="#ffffff" filter="url(#whiteGlow)"/>
    <path d="M-140,-160 L-80,-100 L110,90 L90,110 Z" fill="#c084fc"/>
    <!-- Blade 2 -->
    <path d="M150,-150 L170,-130 L-110,150 L-130,130 Z" fill="#ffffff" filter="url(#whiteGlow)"/>
    <path d="M140,-160 L80,-100 L-90,110 L-110,90 Z" fill="#a855f7"/>
    
    <!-- Central Fighter Crest -->
    <circle cx="0" cy="0" r="95" fill="#1b082e" stroke="#ffffff" stroke-width="6"/>
    
    <!-- Pure White / Purple Flame Fist -->
    <path d="M -30,-45 C -40,-20 -40,30 0,60 C 40,30 40,-20 30,-45 C 10,-20 0,-10 -30,-45 Z" fill="#ffffff" filter="url(#whiteGlow)"/>
    <path d="M -20,-15 C -25,0 -20,25 0,40 C 20,25 25,0 20,-15 C 5,0 0,5 -20,-15 Z" fill="#9333ea"/>
    <circle cx="0" cy="5" r="10" fill="#ffffff"/>
  </g>
  
  <!-- Text Brand -->
  <text x="256" y="440" font-family="'Impact', 'Arial Black', sans-serif" font-size="44" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="4">WARRIOR ARENA</text>
  <text x="256" y="475" font-family="sans-serif" font-size="18" font-weight="bold" fill="#d8b4fe" text-anchor="middle" letter-spacing="3">BY MEHMONA JABEEN</text>
</svg>
